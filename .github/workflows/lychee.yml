name: Links (Lychee)

on:
  pull_request:
  push:
    branches: [main]
  # Позволяет запускать проверку вручную из вкладки Actions.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Проверяем все Markdown-файлы репозитория, включая reports/.
          args: --config lychee.toml --no-progress './**/*.md'
          # Падать, если найдены битые ссылки.
          fail: true
