[project]
name = "pdfreport"
version = "0.1.0"
description = "ПДн Контроль — микросервис генерации PDF-отчёта из JSON (Контракт №2) через Typst"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
