[project]
name = "pdn-backend"
version = "0.1.0"
description = "ПДн Контроль — backend API (auth, scans, reports, billing)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "email-validator>=2.2",
    "resend",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.setuptools]
packages = ["app"]
