server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Раскомментировать когда появится бэкенд:
    # location /api/ {
    #     proxy_pass http://backend:8001/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
