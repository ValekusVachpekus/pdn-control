# Конфигурация Lychee (проверка ссылок в Markdown).
# Документация: https://lychee.cli.rs/

# Считать 429 (rate limit) успехом — публичные сайты часто лимитируют CI.
accept = ["200..=299", "429"]

# Повторные попытки и таймаут для нестабильных внешних хостов.
max_retries = 2
timeout = 20

# Проверять и относительные (внутри репо), и внешние ссылки.
# Узкие исключения ниже — каждое с обоснованием.
exclude = [
  # Локальные адреса из инструкций по запуску (dev-серверы, не существуют в CI).
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://(host|backend):\\d+",

  # Деплой MVP v0 на университетской VM — приватный IP, доступен только из сети
  # Иннополиса, из CI недостижим.
  "^https?://10\\.93\\.26\\.163",
  # Проверен вручную. 
  "https://github.com/users/ValekusVachpekus/projects/1",
  "^https?://10\\.93\\.26\\.163",
  # GitLab Innopolis — за корпоративной аутентификацией, недоступен анонимно из CI.
  "^https://gitlab\\.pg\\.innopolis\\.university",

  # Ссылки версий из CHANGELOG (compare/<tag> и releases/tag/<tag>) резолвятся только
  # после публикации релиза, поэтому в PR, который этот релиз нарезает, недостижимы.
  # GitHub генерирует их автоматически — проверять до публикации нечего.
  "^https://github\\.com/ValekusVachpekus/pdn-control/compare/",
  "^https://github\\.com/ValekusVachpekus/pdn-control/releases/tag/",
]

# Письма (mailto:) не проверяем.
include_mail = false
