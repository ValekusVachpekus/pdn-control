# Удобный запуск микросервиса парсера: docker compose up --build
services:
  crowler:
    build: .
    image: pdn-control-crowler:latest
    ports:
      - "8000:8000"
    environment:
      MAX_CONCURRENT_SCANS: "2"   # сколько проверок одновременно (каждая = свой браузер)
      SCAN_TIMEOUT_SEC: "300"     # жёсткий лимит на одну проверку
    # Браузеру бывает мало /dev/shm по умолчанию.
    shm_size: "1gb"
    restart: unless-stopped
